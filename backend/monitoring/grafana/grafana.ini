[server]
root_url = %(domain)s
serve_from_sub_path = true

[auth.anonymous]
enabled = true

[metrics]
enabled = true

[alerting]
enabled = true

[unified_alerting]
enabled = true

[dashboards]
default_home_dashboard_path = /etc/grafana/provisioning/dashboards/agentwatch_overview.json

[explore]
enabled = true
