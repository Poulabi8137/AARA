name: Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL'
        required: true
        default: 'https://staging.example.com'
      test_type:
        description: 'Test type'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - average-load
          - stress-test
          - spike-test
          - endurance-test

jobs:
  k6-load-test:
    name: k6 ${{ github.event.inputs.test_type }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: load-testing/${{ github.event.inputs.test_type }}.js
          flags: -e BASE_URL=${{ github.event.inputs.target_url }}
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: k6-results
          path: load-testing/*.json
