global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts/prometheus-alerts.yml"

scrape_configs:
  - job_name: "aara-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: "/metrics"
    scheme: http
    scrape_interval: 10s
    scrape_timeout: 5s
    labels:
      application: "aara-backend"
      environment: "production"

  - job_name: "aara-frontend"
    static_configs:
      - targets: ["frontend:3000"]
    metrics_path: "/api/metrics"
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 5s
    labels:
      application: "aara-frontend"
      environment: "production"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      scheme: http
      timeout: 5s
